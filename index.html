<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>snake</title>

<link rel="stylesheet" href="./style.css">

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;900&display=swap" rel="stylesheet">

<script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

<!-- SIGN IN -->
<div class="modal-overlay" id="signInModal">
  <div class="modal">
    <h2><i data-lucide="user-circle"></i>sign in</h2>
    <p>create or log into your account</p>

    <input type="text" id="siUsername" placeholder="username" maxlength="20">
    <input type="password" id="siPassword" placeholder="password">

    <div class="err" id="siErr"></div>

    <button id="btnCreateAcc">
      <i data-lucide="user-plus"></i>create account
    </button>

    <button id="btnLoginAcc" class="secondary">
      <i data-lucide="log-in"></i>log in
    </button>

    <button class="secondary" onclick="skipSignIn()">
      <i data-lucide="ghost"></i>play as guest
    </button>

    <p class="small">saves your scores and settings</p>
  </div>
</div>

<!-- DEV PASS -->
<div class="modal-overlay" id="devPassModal">
  <div class="modal">
    <h2><i data-lucide="lock"></i>dev access</h2>

    <input type="password" id="devPass" placeholder="password">
    <div class="err" id="devPassErr"></div>

    <button onclick="devCheckPass()">
      <i data-lucide="check"></i>submit
    </button>

    <button class="close-btn" onclick="closeDevPass()">
      <i data-lucide="x"></i>close
    </button>
  </div>
</div>

<!-- DEV MENU -->
<div class="modal-overlay" id="devMenuModal">
  <div class="modal">
    <h2><i data-lucide="wrench"></i>dev menu</h2>

    <div class="dev-btn-grid">
      <button onclick="devAddScore100()">score +100</button>
      <button onclick="devLevelUp()">level +1</button>
      <button onclick="devToggleGrid()">toggle grid</button>
      <button onclick="devToggleFps()">toggle fps</button>
      <button onclick="devClearAllScores()">clear scores</button>
      <button onclick="devClearAllUsers()">delete users</button>
      <button onclick="devResetAll()">reset all</button>
      <button onclick="devNukeStorage()">nuke storage</button>
    </div>

    <div id="devStatus"></div>

    <button class="close-btn" onclick="closeDevMenu()">
      <i data-lucide="x"></i>close
    </button>
  </div>
</div>

<!-- SETTINGS -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h2><i data-lucide="settings"></i>settings</h2>

    <div class="settings-row">
      <label>sound</label>
      <button id="soundToggleBtn" onclick="toggleSoundSetting()">on</button>
    </div>

    <div class="settings-row">
      <label>d-pad</label>
      <button id="dpadToggleBtn" onclick="toggleDpadSetting()">off</button>
    </div>

    <div class="settings-row">
      <label>difficulty</label>
      <select id="difficultySelect" onchange="changeDifficultySetting()">
        <option value="easy">easy</option>
        <option value="medium">medium</option>
        <option value="hard">hard</option>
      </select>
    </div>

    <div class="settings-row">
      <label>fruit amount</label>
      <select id="densitySelect" onchange="changeDensitySetting()">
        <option value="1">low</option>
        <option value="2">normal</option>
        <option value="4">high</option>
      </select>
    </div>

    <input type="range" id="colorSlider" min="0" max="360" value="330">

    <button onclick="saveSettings()">save</button>
    <button class="close-btn" onclick="closeSettings()">close</button>
  </div>
</div>

<!-- LEADERBOARD -->
<div class="modal-overlay" id="leaderboardModal">
  <div class="modal">
    <h2><i data-lucide="trophy"></i>leaderboard</h2>
    <div id="lbList"></div>
    <button onclick="closeLeaderboard()">close</button>
  </div>
</div>

<!-- INFO -->
<div class="modal-overlay" id="infoModal">
  <div class="modal">
    <h2><i data-lucide="book-open"></i>how to play</h2>

    <p>
      swipe or use arrows / wasd<br>
      eat fruit, grow, don’t hit walls
    </p>

    <button onclick="closeInfo()">close</button>
  </div>
</div>

<!-- GAME OVER -->
<div class="modal-overlay" id="gameOverModal">
  <div class="modal">
    <h2>game over</h2>

    <p>score: <span id="finalScore">0</span></p>
    <p>mode: <span id="finalDifficulty"></span></p>

    <button onclick="resetGame()">play again</button>
    <button onclick="showStartScreen()">menu</button>
  </div>
</div>

<!-- MAIN -->
<div class="container">

  <div id="startMenuArea">
    <h1 id="gameTitle">snake</h1>

    <button id="playBtn">play</button>
    <button onclick="showSignInModal()">sign in</button>
    <button onclick="openLeaderboard()">leaderboard</button>
    <button onclick="openSettings()">settings</button>
    <button onclick="openInfo()">info</button>
  </div>

  <div id="infoBar">
    <span>score: <span id="score">0</span></span>
    <span>level: <span id="level">1</span></span>
    <span>best: <span id="highScore">0</span></span>
  </div>

  <canvas id="gameCanvas" width="400" height="400"></canvas>

  <div id="gameButtons" style="display:none">
    <button onclick="togglePause()">pause</button>
    <button onclick="showStartScreen()">quit</button>
  </div>

  <div id="dpad">
    <button onclick="handleDpad(0,-1)">up</button>
    <button onclick="handleDpad(-1,0)">left</button>
    <button onclick="handleDpad(1,0)">right</button>
    <button onclick="handleDpad(0,1)">down</button>
  </div>

</div>

<script src="./app.js"></script>

</body>
</html>
