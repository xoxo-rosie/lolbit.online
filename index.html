<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐍 Snake</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            padding: 20px;
        }

        .container {
            text-align: center;
        }

        h1 {
            color: white;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
            font-size: 0.9em;
        }

        #gameCanvas {
            background-color: #1a1a2e;
            border: 4px solid white;
            display: block;
            margin: 0 auto 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 100%;
            height: auto;
        }

        .info {
            display: flex;
            justify-content: space-around;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 1em;
            font-weight: bold;
            color: #333;
            min-width: 120px;
        }

        .controls {
            color: white;
            margin-top: 15px;
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .difficulty-selector {
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: inline-block;
        }

        .difficulty-selector label {
            margin: 0 10px;
            font-weight: bold;
            color: #333;
        }

        .difficulty-selector input[type="radio"] {
            margin-right: 5px;
            cursor: pointer;
        }

        .button-group {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 25px;
            font-size: 1em;
            background: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #667eea;
            transition: all 0.3s;
        }

        button:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        .game-over {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            z-index: 1000;
            text-align: center;
            min-width: 300px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .game-over h2 {
            color: #c33;
            font-size: 2em;
            margin-bottom: 15px;
        }

        .game-over p {
            color: #333;
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .leaderboard {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
        }

        .leaderboard h3 {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #ddd;
            font-size: 0.95em;
        }

        .leaderboard-item:last-child {
            border-bottom: none;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        .power-up-indicator {
            color: #ffff00;
            font-weight: bold;
            margin-top: 5px;
            min-height: 20px;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.8em;
            }
            
            .info-box {
                min-width: 100px;
                font-size: 0.9em;
            }

            button {
                padding: 10px 15px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="overlay" id="overlay"></div>
    <div class="game-over" id="gameOverPopup">
        <h2>GAME OVER!</h2>
        <p>Final Score: <span id="finalScore">0</span></p>
        <p>Difficulty: <span id="finalDifficulty">Easy</span></p>
        <div class="leaderboard">
            <h3>🏆 High Scores</h3>
            <div id="leaderboardList"></div>
        </div>
        <button onclick="location.reload()">Play Again</button>
    </div>

    <div class="container">
        <h1>🐍 Snake</h1>
        <p class="subtitle">Eat food, gain power-ups, climb the leaderboard!</p>
        
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <div class="info">
            <div class="info-box">Score: <span id="score">0</span></div>
            <div class="info-box">Level: <span id="level">1</span></div>
            <div class="info-box">High: <span id="highScore">0</span></div>
        </div>

        <div class="power-up-indicator" id="powerUpIndicator"></div>
        
        <div class="difficulty-selector">
            <label><input type="radio" name="difficulty" value="easy" checked> Easy</label>
            <label><input type="radio" name="difficulty" value="medium"> Medium</label>
            <label><input type="radio" name="difficulty" value="hard"> Hard</label>
        </div>
        
        <div class="controls">
            <p>📱 Use ⬅️ ➡️ ⬇️ ⬆️ arrow keys, WASD, or swipe on mobile</p>
            <p>🎮 Eat 🔴 Red for +10pts | 🟡 Gold for +50pts & speed boost | 🟢 Green for slow mode</p>
        </div>

        <div class="button-group">
            <button onclick="togglePause()">Pause</button>
            <button onclick="resetGame()">Reset</button>
            <button onclick="toggleSound()">🔊 Sound: ON</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        
        let snake = [{x: 10, y: 10}];
        let food = [];
        let powerUps = [];
        let direction = {x: 1, y: 0};
        let nextDirection = {x: 1, y: 0};
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameSpeed = 8;
        let framCount = 0;
        let isPaused = false;
        let gameRunning = true;
        let difficulty = 'easy';
        let soundEnabled = true;
        let activePowerUp = null;
        let powerUpTimer = 0;
        let touchStartX = 0;
        let touchStartY = 0;

        document.getElementById('highScore').textContent = highScore;

        // Initialize food
        function spawnFood() {
            let newFood;
            do {
                newFood = {x: Math.floor(Math.random() * tileCount), y: Math.floor(Math.random() * tileCount), type: 'normal'};
            } while (snake.some(s => s.x === newFood.x && s.y === newFood.y) || food.some(f => f.x === newFood.x && f.y === newFood.y));
            food.push(newFood);
        }

        // Spawn power-ups randomly
        function spawnPowerUp() {
            if (Math.random() < 0.05 && powerUps.length < 2) {
                let newPowerUp;
                const types = ['speed_boost', 'slow_mode'];
                do {
                    newPowerUp = {
                        x: Math.floor(Math.random() * tileCount),
                        y: Math.floor(Math.random() * tileCount),
                        type: types[Math.floor(Math.random() * types.length)]
                    };
                } while (snake.some(s => s.x === newPowerUp.x && s.y === newPowerUp.y) || 
                         food.some(f => f.x === newPowerUp.x && f.y === newPowerUp.y) ||
                         powerUps.some(p => p.x === newPowerUp.x && p.y === newPowerUp.y));
                powerUps.push(newPowerUp);
            }
        }

        // Spawn more food
        function ensureFood() {
            if (food.length < 2) {
                spawnFood();
            }
        }

        ensureFood();

        function playSound(type) {
            if (!soundEnabled) return;
            
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            if (type === 'eat') {
                oscillator.frequency.value = 600;
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.1);
            } else if (type === 'powerup') {
                oscillator.frequency.value = 800;
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.2);
            } else if (type === 'gameover') {
                oscillator.frequency.value = 300;
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.3);
            }
        }

        function drawRect(x, y, size, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x * gridSize, y * gridSize, size * gridSize, size * gridSize);
        }

        function update() {
            if (!gameRunning || isPaused) return;

            framCount++;
            const speedMultiplier = activePowerUp === 'slow_mode' ? 0.5 : (activePowerUp === 'speed_boost' ? 1.5 : 1);
            const updateRate = Math.floor(10 / (gameSpeed * speedMultiplier));
            
            if (framCount < updateRate) return;
            framCount = 0;

            direction = nextDirection;
            const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};

            // Check wall collision (wraps around)
            if (head.x < 0) head.x = tileCount - 1;
            if (head.x >= tileCount) head.x = 0;
            if (head.y < 0) head.y = tileCount - 1;
            if (head.y >= tileCount) head.y = 0;

            // Check self collision
            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    endGame();
                    return;
                }
            }

            snake.unshift(head);

            // Check food collision
            let foodEaten = false;
            for (let i = 0; i < food.length; i++) {
                if (head.x === food[i].x && head.y === food[i].y) {
                    const eatenFood = food[i];
                    const points = eatenFood.type === 'normal' ? 10 : 50;
                    score += points;
                    playSound('eat');
                    food.splice(i, 1);
                    ensureFood();
                    
                    if (eatenFood.type === 'gold') {
                        activatePowerUp('speed_boost');
                    }
                    
                    gameSpeed = Math.min(15, 8 + Math.floor(score / 50));
                    document.getElementById('score').textContent = score;
                    document.getElementById('level').textContent = Math.ceil(gameSpeed / 8);
                    foodEaten = true;
                    break;
                }
            }

            if (!foodEaten) {
                snake.pop();
            }

            // Check power-up collision
            for (let i = 0; i < powerUps.length; i++) {
                if (head.x === powerUps[i].x && head.y === powerUps[i].y) {
                    playSound('powerup');
                    activatePowerUp(powerUps[i].type);
                    powerUps.splice(i, 1);
                    break;
                }
            }

            // Update power-up timer
            if (activePowerUp) {
                powerUpTimer--;
                if (powerUpTimer <= 0) {
                    activePowerUp = null;
                    document.getElementById('powerUpIndicator').textContent = '';
                }
            }

            spawnPowerUp();
        }

        function activatePowerUp(type) {
            activePowerUp = type;
            powerUpTimer = 150; // ~5 seconds at normal speed
            
            if (type === 'speed_boost') {
                document.getElementById('powerUpIndicator').textContent = '⚡ SPEED BOOST ACTIVE!';
            } else if (type === 'slow_mode') {
                document.getElementById('powerUpIndicator').textContent = '🐢 SLOW MODE ACTIVE!';
            }
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid (optional)
            ctx.strokeStyle = '#2a2a4e';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // Draw snake
            for (let i = 0; i < snake.length; i++) {
                if (i === 0) {
                    drawRect(snake[i].x, snake[i].y, 1, '#00ff00');
                    // Draw eyes
                    ctx.fillStyle = '#000';
                    ctx.fillRect(snake[i].x * gridSize + 5, snake[i].y * gridSize + 5, 4, 4);
                    ctx.fillRect(snake[i].x * gridSize + 11, snake[i].y * gridSize + 5, 4, 4);
                } else {
                    const color = i % 2 === 0 ? '#00dd00' : '#00bb00';
                    drawRect(snake[i].x, snake[i].y, 1, color);
                }
            }

            // Draw food
            for (let f of food) {
                if (f.type === 'normal') {
                    drawRect(f.x, f.y, 1, '#ff0000');
                } else if (f.type === 'gold') {
                    drawRect(f.x, f.y, 1, '#ffff00');
                }
            }

            // Draw power-ups
            for (let p of powerUps) {
                if (p.type === 'speed_boost') {
                    ctx.fillStyle = '#ffaa00';
                    ctx.beginPath();
                    ctx.arc((p.x + 0.5) * gridSize, (p.y + 0.5) * gridSize, gridSize / 2 - 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 10px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('⚡', (p.x + 0.5) * gridSize, (p.y + 0.5) * gridSize);
                } else if (p.type === 'slow_mode') {
                    ctx.fillStyle = '#00aaff';
                    ctx.beginPath();
                    ctx.arc((p.x + 0.5) * gridSize, (p.y + 0.5) * gridSize, gridSize / 2 - 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 10px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('🐢', (p.x + 0.5) * gridSize, (p.y + 0.5) * gridSize);
                }
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function handleKeyPress(e) {
            const key = e.key.toLowerCase();
            
            if (key === 'arrowup' || key === 'w') {
                if (direction.y === 0) nextDirection = {x: 0, y: -1};
            } else if (key === 'arrowdown' || key === 's') {
                if (direction.y === 0) nextDirection = {x: 0, y: 1};
            } else if (key === 'arrowleft' || key === 'a') {
                if (direction.x === 0) nextDirection = {x: -1, y: 0};
            } else if (key === 'arrowright' || key === 'd') {
                if (direction.x === 0) nextDirection = {x: 1, y: 0};
            }
        }

        // Touch controls
        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });

        canvas.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            const deltaX = touchEndX - touchStartX;
            const deltaY = touchEndY - touchStartY;

            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                if (deltaX > 0 && direction.x === 0) nextDirection = {x: 1, y: 0};
                else if (deltaX < 0 && direction.x === 0) nextDirection = {x: -1, y: 0};
            } else {
                if (deltaY > 0 && direction.y === 0) nextDirection = {x: 0, y: 1};
                else if (deltaY < 0 && direction.y === 0) nextDirection = {x: 0, y: -1};
            }
        });

        function endGame() {
            gameRunning = false;
            playSound('gameover');
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
            }

            updateLeaderboard();
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalDifficulty').textContent = difficulty.charAt(0).toUpperCase() + difficulty.slice(1);
            document.getElementById('gameOverPopup').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }

        function updateLeaderboard() {
            let scores = JSON.parse(localStorage.getItem('snakeScores') || '[]');
            scores.push({score, difficulty, date: new Date().toLocaleDateString()});
            scores.sort((a, b) => b.score - a.score);
            scores = scores.slice(0, 10);
            localStorage.setItem('snakeScores', JSON.stringify(scores));

            const leaderboardList = document.getElementById('leaderboardList');
            leaderboardList.innerHTML = '';
            scores.forEach((s, i) => {
                const item = document.createElement('div');
                item.className = 'leaderboard-item';
                item.innerHTML = `<span>#${i + 1} ${s.score} pts</span><span>${s.difficulty}</span>`;
                leaderboardList.appendChild(item);
            });
        }

        function togglePause() {
            isPaused = !isPaused;
            document.querySelectorAll('button')[0].textContent = isPaused ? 'Resume' : 'Pause';
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.querySelectorAll('button')[2].textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
        }

        function resetGame() {
            snake = [{x: 10, y: 10}];
            food = [];
            powerUps = [];
            direction = {x: 1, y: 0};
            nextDirection = {x: 1, y: 0};
            score = 0;
            gameSpeed = 8 + (difficulty === 'medium' ? 2 : difficulty === 'hard' ? 4 : 0);
            isPaused = false;
            gameRunning = true;
            framCount = 0;
            activePowerUp = null;
            powerUpTimer = 0;
            document.getElementById('score').textContent = '0';
            document.getElementById('level').textContent = '1';
            document.getElementById('powerUpIndicator').textContent = '';
            document.getElementById('gameOverPopup').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
            document.querySelectorAll('button')[0].textContent = 'Pause';
            ensureFood();
        }

        // Difficulty selector
        document.querySelectorAll('input[name="difficulty"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                difficulty = e.target.value;
                if (!gameRunning) resetGame();
            });
        });

        window.addEventListener('keydown', handleKeyPress);
        updateLeaderboard();
        gameLoop();
    </script>
</body>
</html>
