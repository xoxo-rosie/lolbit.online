<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Weather Dashboard</h1>
            <div class="search-box">
                <input type="text" id="cityInput" placeholder="Enter city name...">
                <button onclick="searchWeather()">Search</button>
            </div>
        </div>

        <div id="loadingSpinner" class="spinner hidden"></div>

        <div id="weatherContainer" class="weather-container">
            <div class="current-weather">
                <div class="city-info">
                    <h2 id="cityName">--</h2>
                    <p id="weatherDescription">--</p>
                </div>
                <div class="temperature-section">
                    <div class="temp-main">
                        <span id="temperature">--</span>
                        <span class="unit">°C</span>
                    </div>
                    <div class="weather-icon">
                        <img id="weatherIcon" src="" alt="Weather icon">
                    </div>
                </div>
                <div class="weather-details">
                    <div class="detail-item">
                        <span class="label">Feels Like</span>
                        <span id="feelsLike" class="value">--°C</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Humidity</span>
                        <span id="humidity" class="value">--%</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Wind Speed</span>
                        <span id="windSpeed" class="value">-- m/s</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Pressure</span>
                        <span id="pressure" class="value">-- hPa</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Visibility</span>
                        <span id="visibility" class="value">-- km</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">UV Index</span>
                        <span id="uvIndex" class="value">--</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="forecastContainer" class="forecast-container hidden">
            <h3>5-Day Forecast</h3>
            <div id="forecastList" class="forecast-list"></div>
        </div>

        <div id="errorContainer" class="error-container hidden"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
